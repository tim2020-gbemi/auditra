<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Auditra - Register</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg:#0d0d1a; --surface:#13131f; --border:#1e1e35; --accent:#4f8ef7; --text:#d0d0e8; --muted:#5a5a7a; --error:#f76f6f; --success:#4cda8a; }
        * { box-sizing:border-box; margin:0; padding:0; }
        body { background:var(--bg); color:var(--text); font-family:'IBM Plex Sans',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; }
        .box { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:40px; width:100%; max-width:420px; }
        .box h1 { font-family:'IBM Plex Mono',monospace; font-size:18px; color:#fff; letter-spacing:.05em; margin-bottom:4px; }
        .box p { color:var(--muted); font-size:12px; font-family:'IBM Plex Mono',monospace; margin-bottom:28px; }
        .field { margin-bottom:18px; }
        .field label { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); margin-bottom:8px; font-family:'IBM Plex Mono',monospace; }
        .field input { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:5px; padding:10px 14px; color:var(--text); font-size:14px; outline:none; }
        .field input:focus { border-color:var(--accent); }
        .error   { background:rgba(247,111,111,.1); border:1px solid rgba(247,111,111,.3); border-radius:5px; padding:10px 14px; color:var(--error); font-size:13px; margin-bottom:18px; }
        .success { background:rgba(76,218,138,.1); border:1px solid rgba(76,218,138,.3); border-radius:5px; padding:10px 14px; color:var(--success); font-size:13px; margin-bottom:18px; }
        .btn { width:100%; background:var(--accent); color:#fff; border:none; border-radius:5px; padding:12px; font-size:14px; font-family:'IBM Plex Mono',monospace; cursor:pointer; }
        .btn:hover { opacity:.85; }
        .footer-link { margin-top:20px; padding-top:20px; border-top:1px solid var(--border); font-size:12px; color:var(--muted); text-align:center; font-family:'IBM Plex Mono',monospace; }
        .footer-link a { color:var(--accent); text-decoration:none; }
        .note { margin-top:16px; padding:10px 14px; background:rgba(79,142,247,.08); border:1px solid rgba(79,142,247,.2); border-radius:5px; font-size:11px; color:var(--muted); font-family:'IBM Plex Mono',monospace; line-height:1.6; }
    </style>
</head>
<body>
    <div class="box">
        <h1>AUDITRA</h1>
        <p>Create Account / Self-Registration</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        {% if success %}
        <div class="success">{{ success }}</div>
        {% else %}
        <form method="POST" action="/register">
            <div class="field">
                <label>Username</label>
                <input type="text" name="username" placeholder="Choose a username" required autofocus>
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" name="password" placeholder="Min. 8 characters" required>
            </div>
            <div class="field">
                <label>Confirm Password</label>
                <input type="password" name="confirm_password" placeholder="Repeat password" required>
            </div>
            <button class="btn" type="submit">CREATE ACCOUNT</button>
        </form>

        <div class="note">
            New accounts require admin approval before you can log in.
            Contact your administrator after registering.
        </div>
        {% endif %}

        <div class="footer-link">
            Already have an account? <a href="/login">Sign in</a>
        </div>
    </div>
</body>
</html>
