<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Auditra - Change Password</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg:#0d0d1a; --surface:#13131f; --border:#1e1e35; --accent:#4f8ef7; --text:#d0d0e8; --muted:#5a5a7a; --error:#f76f6f; --success:#4cda8a; }
        * { box-sizing:border-box; margin:0; padding:0; }
        body { background:var(--bg); color:var(--text); font-family:'IBM Plex Sans',sans-serif; padding:40px 32px; }
        .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:40px; }
        .topbar-left { border-left:3px solid var(--accent); padding-left:20px; }
        .topbar-left h1 { font-family:'IBM Plex Mono',monospace; font-size:22px; color:#fff; }
        .topbar-left p { color:var(--muted); font-size:12px; margin-top:4px; font-family:'IBM Plex Mono',monospace; }
        .topbar-right { display:flex; align-items:center; gap:12px; }
        .back-btn { background:transparent; border:1px solid var(--border); color:var(--muted); border-radius:4px; padding:4px 12px; font-family:'IBM Plex Mono',monospace; font-size:11px; text-decoration:none; }
        .back-btn:hover { border-color:var(--accent); color:var(--text); }
        .logout-btn { background:transparent; border:1px solid var(--border); color:var(--muted); border-radius:4px; padding:4px 12px; font-family:'IBM Plex Mono',monospace; font-size:11px; text-decoration:none; }
        .logout-btn:hover { border-color:var(--accent); color:var(--text); }
        .card { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:32px; max-width:460px; }
        .card h2 { font-family:'IBM Plex Mono',monospace; font-size:14px; color:#fff; margin-bottom:24px; letter-spacing:.05em; }
        .field { margin-bottom:18px; }
        .field label { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); margin-bottom:8px; font-family:'IBM Plex Mono',monospace; }
        .field input { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:5px; padding:10px 14px; color:var(--text); font-size:14px; outline:none; }
        .field input:focus { border-color:var(--accent); }
        .error   { background:rgba(247,111,111,.1); border:1px solid rgba(247,111,111,.3); border-radius:5px; padding:10px 14px; color:var(--error); font-size:13px; margin-bottom:18px; }
        .success { background:rgba(76,218,138,.1); border:1px solid rgba(76,218,138,.3); border-radius:5px; padding:10px 14px; color:var(--success); font-size:13px; margin-bottom:18px; }
        .btn { background:var(--accent); color:#fff; border:none; border-radius:5px; padding:10px 24px; font-size:13px; font-family:'IBM Plex Mono',monospace; cursor:pointer; }
        .btn:hover { opacity:.85; }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="topbar-left">
            <h1>CHANGE PASSWORD</h1>
            <p>Signed in as {{ username }}</p>
        </div>
        <div class="topbar-right">
            <a href="/" class="back-btn">Back to Dashboard</a>
            <a href="/logout" class="logout-btn">Sign Out</a>
        </div>
    </div>

    <div class="card">
        <h2>UPDATE YOUR PASSWORD</h2>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        {% if success %}
        <div class="success">{{ success }}</div>
        {% endif %}

        <form method="POST" action="/change-password">
            <div class="field">
                <label>Current Password</label>
                <input type="password" name="current_password" required>
            </div>
            <div class="field">
                <label>New Password</label>
                <input type="password" name="new_password" placeholder="Min. 8 characters" required>
            </div>
            <div class="field">
                <label>Confirm New Password</label>
                <input type="password" name="confirm_password" required>
            </div>
            <button class="btn" type="submit">UPDATE PASSWORD</button>
        </form>
    </div>
</body>
</html>
